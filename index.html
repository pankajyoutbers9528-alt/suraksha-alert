<!DOCTYPE html>
<html lang="hi">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Suraksha Alert</title>

<!-- PWA -->
<link rel="manifest" href="./manifest.json">

<meta name="theme-color" content="#d60000">

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:#eef2f7;
color:#202124;
}

header{
background:linear-gradient(135deg,#d60000,#ff3131);
color:white;
text-align:center;
padding:18px 10px;
font-size:24px;
font-weight:bold;
box-shadow:0 3px 12px rgba(0,0,0,.2);
}

.subtitle{
font-size:12px;
margin-top:5px;
}

.card{
background:white;
margin:16px;
padding:22px;
border-radius:20px;
box-shadow:0 5px 18px rgba(0,0,0,.10);
}

h1{
text-align:center;
margin:5px 0 10px;
}

h2{
margin-top:0;
font-size:20px;
}

p{
line-height:1.6;
}

.center{
text-align:center;
}

input{
width:100%;
padding:15px;
margin:8px 0 14px;
border:1px solid #ccc;
border-radius:12px;
font-size:17px;
}

button{
width:100%;
padding:15px;
border:0;
border-radius:13px;
font-size:17px;
font-weight:bold;
margin-top:9px;
}

.sos{
width:210px;
height:210px;
border-radius:50%;
background:linear-gradient(145deg,#ff0000,#c40000);
color:white;
font-size:46px;
box-shadow:0 8px 25px rgba(220,0,0,.35);
border:7px solid white;
}

.save{
background:#1976d2;
color:white;
}

.location{
background:#218838;
color:white;
}

.call{
background:#008000;
color:white;
}

.sms{
background:#f57c00;
color:white;
}

.pinbtn{
background:#6a1b9a;
color:white;
}

.logout{
background:#555;
color:white;
}

.contactbtn{
background:#1565c0;
color:white;
}

.result{
background:#f3f5f7;
padding:16px;
border-radius:13px;
margin-top:14px;
line-height:1.7;
word-break:break-word;
}

.hidden{
display:none;
}

.error{
color:#c40000;
font-weight:bold;
}

.success{
color:#087f23;
font-weight:bold;
}

.security{
border-left:5px solid #6a1b9a;
}

.locationCard{
border-left:5px solid #218838;
}

.warning{
border-left:5px solid #ff9800;
}

.sosCard{
border:2px solid #ffd0d0;
}

a{
color:#1565c0;
font-weight:bold;
}

</style>
</head>

<body>

<header>

🚨 Suraksha Alert

<div class="subtitle">
Emergency Safety & Location Assistant
</div>

</header>


<!-- APP PIN -->

<div id="pinScreen" class="card center">

<h1>🔐 App Lock</h1>

<p>
Suraksha Alert खोलने के लिए अपना App PIN डालें।
</p>

<input
type="password"
id="pinInput"
inputmode="numeric"
maxlength="6"
placeholder="4-6 अंकों का PIN">

<button
class="pinbtn"
onclick="unlockApp()">

🔓 Unlock App

</button>

<div id="pinMessage"></div>

<hr style="margin:25px 0">

<p>
पहली बार इस्तेमाल कर रहे हैं?
</p>

<button
class="save"
onclick="showCreatePin()">

🔑 नया PIN बनाएं

</button>

</div>


<!-- MAIN APP -->

<div id="mainApp" class="hidden">


<!-- SOS -->

<div class="card center sosCard">

<h1>🆘 आपातकालीन SOS</h1>

<p>
खतरा महसूस होने पर नीचे SOS बटन दबाएँ।
</p>

<button
class="sos"
onclick="getLocation()">

SOS

</button>

<div
id="locationResult"
class="result hidden">
</div>

</div>


<!-- CONTACT -->

<div class="card security">

<h2>🔐 आपातकालीन संपर्क</h2>

<div id="contactLocked">

<p>
Contact देखने या बदलने के लिए पहले Contact PIN डालें।
</p>

<button
class="contactbtn"
onclick="unlockContact()">

🔓 Contact Unlock करें

</button>

</div>


<div id="contactArea" class="hidden">

<label>👤 नाम</label>

<input
type="text"
id="contactName"
placeholder="जैसे: पापा">


<label>📱 मोबाइल नंबर</label>

<input
type="tel"
id="contactPhone"
inputmode="tel"
placeholder="मोबाइल नंबर">


<button
class="save"
onclick="saveContact()">

💾 Contact Save करें

</button>

<div id="saveMessage"></div>


<button
class="pinbtn"
onclick="changeContactPin()">

🔑 Contact PIN बदलें

</button>


<button
class="logout"
onclick="lockContact()">

🔒 Contact Lock करें

</button>

</div>

</div>


<!-- LOCATION -->

<div class="card locationCard">

<h2>📍 वर्तमान
